- name: Create root-owned release directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - '{{ music_store_root }}'
    - '{{ music_store_root }}/infra'
    - '{{ music_store_root }}/infra/nginx'

- name: Install release and service files
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../../{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
    validate: '{{ item.validate | default(omit) }}'
  loop:
    - { src: docker-compose.yml, dest: '{{ music_store_root }}/docker-compose.yml', mode: '0644' }
    - {
        src: infra/nginx/default.conf,
        dest: '{{ music_store_root }}/infra/nginx/default.conf',
        mode: '0644',
      }
    - {
        src: infra/release/compose.release.yml,
        dest: '{{ music_store_root }}/compose.release.yml',
        mode: '0600',
      }
    - { src: infra/release/smoke.py, dest: '{{ music_store_root }}/smoke.py', mode: '0600' }
    - {
        src: infra/release/release.sh,
        dest: /usr/local/sbin/music-store-release,
        mode: '0755',
        validate: '/bin/bash -n %s',
      }
    - {
        src: infra/release/ssh-command,
        dest: /usr/local/sbin/music-store-ssh,
        mode: '0755',
        validate: '/bin/bash -n %s',
      }
    - {
        src: infra/release/music-store.sudoers,
        dest: /etc/sudoers.d/music-store,
        mode: '0440',
        validate: '/usr/sbin/visudo -cf %s',
      }
  register: deployed_files

- name: Render the environment configuration
  ansible.builtin.template:
    src: release.env.j2
    dest: '{{ music_store_root }}/release.env'
    owner: root
    group: root
    mode: '0600'
  register: release_env
  no_log: true
  diff: false

- name: Authenticate Docker for a private GitHub package
  ansible.builtin.command:
    argv: [docker, login, ghcr.io, --username, '{{ music_store_registry_user }}', --password-stdin]
    stdin: '{{ music_store_registry_token }}'
  when: music_store_registry_token | length > 0 and not ansible_check_mode
  changed_when: false
  no_log: true

- name: Read current release state
  ansible.builtin.stat:
    path: '{{ music_store_root }}/.release-state'
  register: release_state

- name: Read accepted commit when present
  ansible.builtin.slurp:
    src: '{{ music_store_root }}/.release-state'
  when: release_state.stat.exists
  register: accepted_release

- name: Choose whether to deploy a commit
  ansible.builtin.set_fact:
    music_store_deploy_required: >-
      {{ not release_state.stat.exists or
         (music_store_update_release | bool and
         (accepted_release.content | b64decode).split()[0] != music_store_initial_sha) }}

- name: Require a published commit SHA for a new release
  ansible.builtin.assert:
    that: music_store_initial_sha is match('^[0-9a-f]{40}$')
  when: music_store_deploy_required

- name: Deploy and verify the requested registry image
  ansible.builtin.command:
    argv: [/usr/local/sbin/music-store-release, deploy, '{{ music_store_initial_sha }}']
  when: music_store_deploy_required and not ansible_check_mode
  changed_when: true

- name: Apply changes to the accepted release
  ansible.builtin.command:
    argv: [/usr/local/sbin/music-store-release, reconcile]
  when: >-
    not music_store_deploy_required and not ansible_check_mode
    and (deployed_files.changed or release_env.changed)
  changed_when: true

- name: Install the service recovery unit
  ansible.builtin.template:
    src: music-store-release.service.j2
    dest: /etc/systemd/system/music-store-release.service
    owner: root
    group: root
    mode: '0644'
  register: release_unit

- name: Enable recovery at boot
  ansible.builtin.systemd_service:
    name: music-store-release
    enabled: true
    daemon_reload: '{{ release_unit.changed }}'
  when: not ansible_check_mode

- name: Check readiness on the target server
  ansible.builtin.uri:
    url: 'http://{{ music_store_http_bind }}:{{ music_store_http_port }}/health/ready'
    return_content: true
  register: readiness
  until: readiness.status | default(0) == 200 and readiness.json.status | default('') == 'ready'
  retries: 12
  delay: 3
  when: not ansible_check_mode

- name: Read the accepted release after configuration
  ansible.builtin.slurp:
    src: '{{ music_store_root }}/.release-state'
  register: verified_release
  when: not ansible_check_mode

- name: Confirm that the target serves the accepted release
  ansible.builtin.uri:
    url: 'http://{{ music_store_http_bind }}:{{ music_store_http_port }}/version'
    return_content: true
  register: version
  failed_when: version.json.revision | default('') != (verified_release.content | b64decode).split()[0]
  when: not ansible_check_mode
