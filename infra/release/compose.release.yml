x-release-image: &release-image '${REGISTRY_IMAGE:?Set REGISTRY_IMAGE}:${RELEASE_TAG:?Specify a release commit SHA}'
services:
  migrate:
    image: *release-image
    build: !reset null
  app1:
    image: *release-image
  app2:
    image: *release-image
  nginx:
    environment:
      NGINX_CONFIG_SHA: '${NGINX_CONFIG_SHA:-unmanaged}'
