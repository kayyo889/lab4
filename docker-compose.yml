name: music-store
x-app: &app
  image: music-store:${APP_TAG:-local}
  user: "1000:1000"
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  cpus: 0.50
  pids_limit: 100
  stop_grace_period: 20s
  environment: &app-env
    NODE_ENV: production
    PORT: "3000"
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: ${DB_USER:-music_store}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    DB_NAME: ${DB_NAME:-music_store}
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    user: "70:70"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-music_store}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-music_store}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-dev}
    restart: "no"
    command: [node, node_modules/knex/bin/cli.js, migrate:latest]
    depends_on:
      db:
        condition: service_healthy
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
  nginx:
    image: nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
    user: "101:101"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    ports: ['${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080']
    volumes: ['./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [frontend, backend]
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -Y off -q -O /dev/null http://127.0.0.1:8080/health/ready']
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  frontend:
  backend:
    internal: true
volumes:
  pgdata:
